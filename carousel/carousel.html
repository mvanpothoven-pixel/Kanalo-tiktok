html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg);font-family:I,sans-serif;color:#fff}
.slide{position:absolute;inset:0;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(140px);opacity:.55}
.grad{background:linear-gradient(90deg,var(--v),var(--p) 50%,var(--o))}
.gtext{background:linear-gradient(90deg,#9b74ff,var(--p) 50%,var(--o));-webkit-background-clip:text;color:transparent}
.brand{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:16px;font-size:34px;font-weight:600}
.brand img{height:52px}
.pg{position:absolute;right:72px;top:72px;font-size:26px;color:var(--mut);font-weight:600;letter-spacing:2px}
.h1{position:absolute;left:72px;right:72px;top:150px;font-weight:800;font-size:84px;line-height:1.02;letter-spacing:-2px}
.h1 i{font-family:L;font-style:italic;font-weight:500;letter-spacing:-1px}
.sub{position:absolute;left:74px;right:110px;font-size:34px;line-height:1.35;color:#c9c5d8;font-weight:400}
.swipe{position:absolute;right:72px;bottom:60px;font-size:26px;font-weight:700;letter-spacing:4px;color:#d8d4e6;display:flex;gap:14px;align-items:center}
.swipe:before{content:"";width:70px;height:3px;background:linear-gradient(90deg,transparent,var(--p))}
/* devices */
.phone{position:absolute;background:#08080b;border-radius:78px;padding:16px;box-shadow:0 0 0 3px #2b2833,0 50px 120px rgba(0,0,0,.6)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:62px;overflow:hidden;background:#0d0c12}
.island{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:150px;height:42px;border-radius:24px;background:#000;z-index:5}
.sbar{position:absolute;top:24px;left:44px;right:40px;display:flex;justify-content:space-between;font-size:22px;font-weight:700;z-index:4}
.tv{position:absolute;background:#050507;border-radius:22px;padding:14px;box-shadow:0 0 0 3px #26232e,0 50px 120px rgba(0,0,0,.6)}
.tv .scr{position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;background:#0d0c12}
.tv:after{content:"";position:absolute;left:50%;bottom:-46px;transform:translateX(-50%);width:220px;height:46px;background:linear-gradient(#1c1a22,#0c0b10);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
.ipad{position:absolute;background:#08080b;border-radius:44px;padding:20px;box-shadow:0 0 0 3px #2b2833,0 50px 120px rgba(0,0,0,.6)}
.ipad .scr{position:relative;width:100%;height:100%;border-radius:26px;overflow:hidden;background:#0d0c12}
/* app ui (phone, 390-wide logical, scaled) */
.ui{position:absolute;left:0;top:0;transform-origin:0 0;font-family:I}
.ttl{font-size:34px;font-weight:800}
.hero{position:relative;border-radius:22px;overflow:hidden;background-size:cover;background-position:center}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(10,9,15,.92))}
.hero .t{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;font-weight:700;color:#fff}
.chip{display:inline-block;background:#262333;border-radius:10px;padding:5px 10px;font-size:12px;font-weight:600;color:#d6d2e4}
.row{display:flex;gap:10px}
.pst{flex:0 0 auto;border-radius:12px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.pst .r{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);border-radius:7px;font-size:10px;padding:2px 6px;font-weight:700}
.bar{height:4px;border-radius:3px;background:#2d2a38;overflow:hidden}.bar b{display:block;height:100%}
.list{background:var(--card);border-radius:16px}
.li{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:15px;font-weight:600;border-bottom:1px solid #24212e}
.li:last-child{border:none}
.star{color:#f6c445}
.tag{position:absolute;background:#fff;color:#14121b;border-radius:22px;padding:18px 26px;font-size:30px;font-weight:700;box-shadow:0 20px 50px rgba(0,0,0,.45);display:flex;gap:12px;align-items:center;white-space:nowrap}
.tag.g{background:linear-gradient(90deg,var(--v),var(--p),var(--o));color:#fff}
.num{position:absolute;font-weight:900;font-size:220px;line-height:1;opacity:.12}
